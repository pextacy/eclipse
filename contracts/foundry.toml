# Foundry config. The CI-backed contract test suite lives in test-foundry/ and runs
# as REAL Coston2 fork tests (no mocks) — `forge test` forks the live chain at a
# pinned block against the real registry / FTSO / FXRP. remappings.txt wires
# forge-std (vendored in lib/) and @openzeppelin (from node_modules).
[profile.default]
src = "src"
test = "test-foundry"
out = "out"
# Foundry and Hardhat both default their compiler cache to `cache/solidity-files-cache.json`
# but write mutually-incompatible formats. Running `hardhat compile` (for the deploy
# artifacts) would clobber Foundry's cache, making every subsequent `forge test` log
# `invalid type: sequence, expected a map` and recompile from scratch. Give Foundry its
# own cache dir so the two toolchains never collide.
cache_path = "cache-forge"
libs = ["node_modules"]
solc = "0.8.25"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/=node_modules/@openzeppelin/",
]

[fmt]
line_length = 100
tab_width = 4
