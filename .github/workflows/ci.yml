name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install
        run: pnpm install --frozen-lockfile

      # Workspace libs must be built so downstream typechecks resolve their types.
      - name: Build workspace libs
        run: pnpm --filter @eclipse/shared --filter @eclipse/tee --filter @eclipse/relay build

      - name: Compile contracts (hardhat artifacts for deploy)
        run: pnpm --filter @eclipse/contracts build

      # Contract tests run against a REAL Coston2 fork — no mocks. Real
      # FlareContractRegistry, FtsoV2, FeeCalculator, FXRP and WNat are pulled in
      # by forking Coston2 at a pinned block (see test-foundry/EclipseSettlement.t.sol).
      - name: Contract fork tests (real Coston2, no mocks)
        working-directory: contracts
        run: forge test -vv

      - name: Engine tests
        run: pnpm --filter @eclipse/tee test

      - name: Relay tests
        run: pnpm --filter @eclipse/relay test

      - name: Typecheck
        run: pnpm -r --if-present typecheck

      - name: Secret scan (no committed private keys)
        run: |
          if git grep -nE '(DEPLOYER_PRIVATE_KEY|PRIVATE_KEY)\s*=\s*0x[0-9a-fA-F]{64}' -- . ':!*.example'; then
            echo "::error::A private key looks committed."; exit 1
          fi
          echo "No committed secrets found."

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @eclipse/shared build
      - run: pnpm --filter @eclipse/web build
